[project]
name = "intervona-agent"
version = "0.3.0"
description = "Intervona live voice interviewer + prep/post pipelines."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
    "fastapi>=0.140",
    "uvicorn>=0.51",
    "httpx>=0.28",
    "pydantic-settings>=2.14",
    "langgraph>=1.2",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "markitdown[pdf,docx]>=0.1.6",
    "openai>=2.48",
]

[project.optional-dependencies]
livekit = [
    "livekit-agents>=1.6",
    "livekit-plugins-silero>=1.6",
    "livekit-plugins-openai>=1.6",
    "livekit-plugins-turn-detector>=1.6",
]

[dependency-groups]
dev = ["ruff>=0.15"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.ruff]
line-length = 100
src = ["src", "tests"]
